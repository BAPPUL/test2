<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>오늘의 생활계획표</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ── 색: 시스템 다크/라이트를 따름. 원형 시간표도 같은 변수를 읽어 그림 ── */
:root{
  color-scheme:dark;
  --bg:#0d1020;--panel:#151a2d;--panel-2:#1c2239;--hole:#111527;
  --ink:#eef0fb;--muted:#9ea5c3;--faint:#676e8f;--line:rgba(255,255,255,.07);
  --accent:#a3afff;--accent-ink:#0d1020;--accent-soft:rgba(163,175,255,.13);
  --now:#ff6f61;--ok:#4fd1a1;
  --track:#1b2038;--track-past:#232a48;--tick:#4a5175;
  --radius:24px;
  --font:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
}
@media(prefers-color-scheme:light){:root{
  color-scheme:light;
  --bg:#eef0f6;--panel:#ffffff;--panel-2:#f4f5fa;--hole:#ffffff;
  --ink:#151829;--muted:#596080;--faint:#8b91ad;--line:rgba(21,24,41,.08);
  --accent:#4453d8;--accent-ink:#ffffff;--accent-soft:rgba(68,83,216,.09);
  --now:#e5483b;--ok:#159b6c;
  --track:#e7eaf3;--track-past:#dadeec;--tick:#b5bad0;
}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 var(--font);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
main{max-width:1500px;margin:auto;padding:20px 24px 40px}

/* ── 상단 바 ── */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand::before{content:"";width:26px;height:26px;flex:none;border-radius:50%;
  background:conic-gradient(var(--accent) 0 34%,transparent 0 40%,var(--now) 0 52%,transparent 0 58%,var(--muted) 0 92%,transparent 0);
  -webkit-mask:radial-gradient(circle,transparent 6px,#000 6.5px);mask:radial-gradient(circle,transparent 6px,#000 6.5px)}
h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
nav{display:flex;align-items:center;gap:8px}
.date-pill{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
#date{min-width:12.5em;text-align:center;font-size:16px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.icon-btn{width:34px;height:34px;border:0;border-radius:50%;background:transparent;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
#today{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px}
#today:hover{background:var(--panel-2)}
#connect{justify-self:end;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 14px;border-radius:999px;border:0;
  background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:14px;cursor:pointer;white-space:nowrap}
#connect::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.45}
#connect.on{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
#connect.on::before{background:var(--ok);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
#connect:hover{filter:brightness(1.08)}

/* ── 3단 대시보드 ── */
.layout{display:grid;grid-template-columns:minmax(260px,1fr) minmax(460px,1.75fr) minmax(290px,1.15fr);gap:18px;align-items:start}
.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.wheel-card{position:sticky;top:16px;border-radius:32px;padding:22px 24px 18px}
#next-up{margin:0 0 6px;min-height:22px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--muted);text-align:center}
#next-up b{color:var(--ink);font-weight:650}
#next-up:empty{visibility:hidden}
canvas{display:block;width:100%;max-width:660px;margin:auto;aspect-ratio:1;cursor:pointer;touch-action:manipulation}
#wheel-hint{margin:6px 0 0;text-align:center;font-size:12.5px;color:var(--faint)}

.side-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.025em}
h3{display:flex;align-items:center;gap:6px;margin:18px 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
h3 span{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--panel-2);display:inline-grid;place-items:center;font-size:11.5px;color:var(--muted)}
[role=status]{margin:6px 0;font-size:13px;color:var(--muted)}
[role=status]:empty{display:none}

/* ── 접히는 추가 양식 ── */
details{margin:0}
summary{cursor:pointer;list-style:none;user-select:none}
summary::-webkit-details-marker{display:none}
.add>summary{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:14px;background:var(--panel-2);color:var(--muted);font-size:14px;font-weight:500}
.add>summary:hover{color:var(--ink)}
.add>summary::before{content:"+";display:grid;place-items:center;width:22px;height:22px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:16px;transition:transform .18s}
.add[open]>summary{border-radius:14px 14px 0 0;color:var(--ink)}
.add[open]>summary::before{transform:rotate(45deg)}
form{display:grid;gap:8px;margin:0;padding:4px 12px 12px;background:var(--panel-2);border-radius:0 0 14px 14px}
form input:not([type=checkbox]),form select{width:100%;min-width:0;height:40px;margin:0;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);outline:none}
form input:not([type=checkbox]):focus,form select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
form label{font-size:12.5px;color:var(--muted)}
.check-label{display:flex;align-items:center;gap:8px;padding:2px 0}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.times label{display:grid;gap:4px;min-width:0}
form button{height:40px;border:0;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-weight:650;cursor:pointer}
form button:hover{filter:brightness(1.08)}
form button:disabled{background:var(--track-past);color:var(--faint);cursor:not-allowed;filter:none}
#task-feedback,#event-feedback{font-size:13px;color:var(--muted);margin:8px 2px 4px}

/* ── 체크박스 (둥근 체크) ── */
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin:0;border:2px solid var(--faint);border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s}
input[type=checkbox]:hover{border-color:var(--accent)}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{content:"";width:9px;height:5px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.check-label input[type=checkbox]{width:16px;height:16px;border-radius:5px}
.check-label input[type=checkbox]:checked::after{width:7px;height:4px}

/* ── 목록 ── */
.item{display:grid;align-items:center;column-gap:12px;min-width:0;padding:10px;border-radius:14px}
.item strong{font-weight:600;overflow-wrap:anywhere;min-width:0}
#list{margin-top:10px;display:grid;gap:2px}
.event{grid-template-columns:3.4em 4px 1fr;width:100%;text-align:left;background:none;border:0;cursor:pointer}
.event:hover{background:var(--panel-2)}
.event time{display:grid;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.event time .s{font-size:14px;font-weight:600}
.event time .e{font-size:12px;color:var(--faint)}
.event time .all{font-size:13px;font-weight:600;color:var(--muted)}
.dot{width:4px;height:100%;min-height:30px;border-radius:4px}
.event.past{opacity:.42}
.event.now{background:color-mix(in srgb,var(--now) 11%,transparent)}
.event.now strong::after{content:"지금";display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;background:var(--now);color:#fff;font-size:11px;font-weight:700;vertical-align:2px}
.event.selected{background:var(--accent-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
#tasks{margin-top:4px}
.task{grid-template-columns:20px 1fr;align-items:start;cursor:pointer;row-gap:1px}
.task input{margin-top:1px}
.task small{grid-column:2;font-size:12px;color:var(--faint)}
.task:hover{background:var(--panel-2)}
#completed-panel{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
#completed-panel>summary{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13.5px;font-weight:600;color:var(--muted)}
#completed-panel>summary::before{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(-45deg);transition:transform .18s}
#completed-panel[open]>summary::before{transform:rotate(45deg)}
.completed .item strong{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--faint);font-weight:500}

/* ── 연결 설정 ── */
#settings{margin-top:28px;max-width:72ch;font-size:14px;color:var(--muted)}
#settings>summary{display:inline-flex;align-items:center;gap:8px;padding:6px 0;font-weight:500}
#settings>summary::before{content:"⚙";font-size:15px}
#settings p{line-height:1.7}
#settings input{width:min(100%,540px);height:40px;padding:0 12px;margin:6px 0 10px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
code{font-size:.92em;padding:1px 6px;border-radius:6px;background:var(--panel-2)}
a{color:var(--accent)}

/* ── 태블릿: 시간표 위, 목록 둘 아래 ── */
@media(max-width:1120px){
  .layout{grid-template-columns:1fr 1fr}
  .wheel-card{grid-column:1/-1;order:-1;position:static;max-width:720px;width:100%;justify-self:center}
  .side{position:static;max-height:none;overflow:visible}
}
/* ── 휴대폰: 시간표 → 하루 일정 → 할 일 ── */
@media(max-width:720px){
  main{padding:12px 12px 32px}
  .top{grid-template-columns:1fr auto;gap:12px;margin-bottom:14px}
  nav{grid-column:1/-1;grid-row:2}
  .date-pill{flex:1}
  #date{min-width:0;flex:1;font-size:15px}
  #connect{height:38px;padding:0 13px 0 11px;font-size:13px}
  #today{height:42px}
  .layout{grid-template-columns:1fr;gap:12px}
  .panel{padding:16px;border-radius:20px}
  .wheel-card{padding:14px 8px 12px;border-radius:26px}
  .schedule{order:0}.todo{order:1}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#settings[hidden]{display:none} #settings h2{font-size:16px;margin:0 0 10px} #settings{margin:14px 0;padding:14px}.event-entry{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px}.event-color{width:30px;height:30px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);cursor:pointer}</style>
<main>
<header class="top">
  <div class="brand"><h1>오늘의 생활계획표</h1></div>
  <nav aria-label="날짜 선택"><div class="date-pill"><button id="prev" class="icon-btn" aria-label="전날">‹</button><strong id="date"></strong><button id="next" class="icon-btn" aria-label="다음 날">›</button></div><button id="today">오늘</button></nav>
  <button id="connect" type="button">Google로 시작하기</button>
</header>

<div class="layout">
<section class="panel side todo">
  <div class="side-head"><h2>할 일</h2></div>
  <details id="new-task-panel" class="add"><summary>할 일 추가</summary><form id="new-task"><input name="title" aria-label="할 일 이름" placeholder="무엇을 할까요?" required><select name="list" aria-label="할 일 목록" required></select><label class="check-label"><input type="checkbox" name="dated" checked> 선택한 날짜에 추가</label><button>할 일 추가</button></form></details>
  <p id="task-feedback" role="status"></p>
  <p id="task-status" role="status"></p><div id="tasks"></div>
  <details id="completed-panel" class="completed"><summary id="completed-summary">완료한 할 일</summary><div id="completed-tasks"></div></details>
</section>
<section class="panel wheel-card" aria-label="24시간 원형 계획표">
  <p id="next-up" aria-live="polite"></p>
  <canvas id="wheel" role="img" aria-label="자정부터 시계 방향으로 표시한 24시간 일정. 상세 일정은 옆 목록에 있습니다."></canvas>
  <p id="wheel-hint">조각이나 일정을 누르면 가운데에 전체 제목이 보여요</p>
</section>
<section class="panel side schedule">
  <div class="side-head"><h2>하루 일정</h2></div>
  <details id="new-event-panel" class="add"><summary>일정 추가</summary><form id="new-event"><input name="title" aria-label="일정 이름" placeholder="일정 이름" required><select name="calendar" aria-label="저장할 캘린더" required></select><div class="times"><label>시작<input name="start" type="time" required></label><label>끝<input name="end" type="time" required></label></div><button>일정 저장</button></form></details>
  <p id="event-feedback" role="status"></p>
  <p id="status" role="status"></p><div id="list"></div>
</section>
</div>

</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const palette = ['#c8bef2','#ffd2a5','#acdcca','#f0b8d4','#bdd8f6','#eee0a1'];
const demo = [[0,480,'수면'],[480,540,'아침 준비'],[540,600,'외출 및 이동'],[600,780,'집중 작업'],[780,840,'점심'],[840,1020,'영상 편집'],[1020,1080,'산책'],[1110,1200,'저녁'],[1200,1320,'자유 시간'],[1320,1440,'취침 준비']]
  .map(([start,end,title],i)=>({start,end,title,color:palette[i%palette.length]}));
const sessionKey='planner.google.readonly';
function restoreSession(){
  try{
    const saved=JSON.parse(localStorage.getItem(sessionKey) ?? sessionStorage.getItem(sessionKey));
    if(saved?.expiresAt>Date.now()+30000 && typeof saved.token==='string'){ localStorage.setItem(sessionKey,JSON.stringify(saved)); return saved.token; }
    { localStorage.removeItem(sessionKey); sessionStorage.removeItem(sessionKey); }
  }catch{}
  return '';
}
function saveSession(result){
  try{
    if(result)localStorage.setItem(sessionKey,JSON.stringify({
      token:result.access_token,expiresAt:Date.now()+Number(result.expires_in)*1000
    }));
    else { localStorage.removeItem(sessionKey); sessionStorage.removeItem(sessionKey); }
  }catch{}
}
let day = new Date(), events = demo, token = restoreSession(), revision = 0, authScript;
let selected = null, wheelSlices = [];
const minute = d => d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
const format = n => String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0');
const dateKey = d => [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const angle = n => n/1440*Math.PI*2-Math.PI/2;
const isToday = () => dateKey(day)===dateKey(new Date());
const TAU = Math.PI*2;
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* 조각 배경색에 맞춰 글자색 선택 */
function textOn(hex){
  const m=/^#?([\da-f]{6})$/i.exec(hex||'');
  if(!m)return '#151829';
  const n=parseInt(m[1],16), L=0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255);
  return L>150?'#151829':'#ffffff';
}
/* 단어 단위 줄바꿈, 긴 단어는 글자 단위로 자름 */
function wrapLines(c,text,maxW,maxLines){
  const lines=[]; let line='', truncated=false;
  for(let t of text.split(/(\s+)/).filter(Boolean)){
    if(c.measureText(line+t).width<=maxW){line+=t;continue;}
    if(line.trim()){lines.push(line.trim());line='';}
    for(const ch of Array.from(t.trimStart())){
      if(c.measureText(line+ch).width>maxW&&line){lines.push(line);line='';}
      line+=ch;
    }
  }
  if(line.trim())lines.push(line.trim());
  if(lines.length>maxLines){
    truncated=true; lines.length=maxLines;
    const chars=Array.from(lines[maxLines-1]);
    while(chars.length&&c.measureText(chars.join('')+'…').width>maxW)chars.pop();
    lines[maxLines-1]=chars.join('')+'…';
  }
  return {lines,truncated};
}
/* 가로 글상자가 부채꼴 조각 안에 완전히 들어가는지 */
function fitsBox(cx,cy,w,h,inner,outer,a,span){
  for(const dx of [-.5,0,.5])for(const dy of [-.5,0,.5]){
    if(!dx&&!dy)continue;
    const x=cx+dx*w, y=cy+dy*h, pr=Math.hypot(x,y);
    if(pr<inner+4||pr>outer-4)return false;
    const rel=((Math.atan2(y,x)-a)%TAU+TAU)%TAU, pad=4/pr;
    if(rel<pad||rel>span-pad)return false;
  }
  return true;
}
function draw(){
  const canvas=$('wheel'), width=canvas.clientWidth;
  if(!width)return;
  const dpr=window.devicePixelRatio||1;
  canvas.width=canvas.height=Math.round(width*dpr);
  const c=canvas.getContext('2d');
  c.scale(canvas.width/540,canvas.height/540);
  c.translate(270,270);
  const k=width/540, px=n=>n/k;                 // 화면 px 기준 글자 크기
  const FONT=getComputedStyle(document.body).fontFamily;
  const col={ink:cssVar('--ink'),muted:cssVar('--muted'),faint:cssVar('--faint'),track:cssVar('--track'),past:cssVar('--track-past'),
             tick:cssVar('--tick'),hole:cssVar('--hole'),now:cssVar('--now'),accent:cssVar('--accent')};
  const r=212, R0=102;
  const now=new Date(), nowMin=minute(now), today=isToday();
  const ring=(inner,outer,a,b)=>{c.beginPath();c.arc(0,0,outer,a,b);c.arc(0,0,inner,b,a,true);c.closePath();};

  // 빈 시간 트랙 (오늘이면 지난 시간을 살짝 진하게)
  ring(R0,r,0,TAU);c.fillStyle=col.track;c.fill();
  if(today&&nowMin>0){ring(R0,r,angle(0),angle(nowMin));c.fillStyle=col.past;c.fill();}

  // 겹치는 일정끼리만 칸을 나눔
  const slices=[]; let cluster=[], laneEnds=[], clusterEnd=-1;
  const closeCluster=()=>{for(const s of cluster)s.lanes=laneEnds.length;cluster=[];laneEnds=[];};
  for(const e of events.filter(e=>!e.allDay).sort((a,b)=>a.start-b.start)){
    if(e.start>=clusterEnd)closeCluster();
    let lane=laneEnds.findIndex(end=>end<=e.start);
    if(lane<0)lane=laneEnds.length;
    laneEnds[lane]=e.end;clusterEnd=Math.max(clusterEnd,e.end);
    const s={e,lane};cluster.push(s);slices.push(s);
  }
  closeCluster();
  wheelSlices=[];
  for(const {e,lane,lanes} of slices){
    const band=(r-R0)/lanes, outer=r-lane*band, inner=outer-band;
    const a=angle(e.start), b=angle(e.end), span=b-a, mid=(a+b)/2, rad=(inner+outer)/2;
    wheelSlices.push({e,inner,outer});
    // 조각 사이 틈 + 둥근 모서리: 안쪽으로 줄여 채운 뒤 같은 색으로 테두리
    const inset=3.2, ga=Math.min(inset/inner,span/4);
    ring(inner+inset,outer-inset,a+ga,b-ga);
    c.globalAlpha=today&&e.end<=nowMin&&e!==selected?.5:1;
    c.fillStyle=e.color;c.strokeStyle=e.color;c.lineWidth=3.5;c.lineJoin='round';c.fill();c.stroke();
    c.fillStyle=textOn(e.color);c.textAlign='center';c.textBaseline='middle';
    // 1) 가로로 한두 줄
    let placed=false;
    const x=Math.cos(mid)*rad, y=Math.sin(mid)*rad;

async function refreshTasks(request){
  const status=document.getElementById('task-status'), list=document.getElementById('tasks');
  list.replaceChildren();
  const completed=document.getElementById('completed-tasks');
  completed.replaceChildren(); document.getElementById('completed-summary').textContent='완료한 할 일';
  if(!token){status.textContent='Google 캘린더를 연결하면 할 일이 여기에 보여요.';return;}

  const selectedDate=dateKey(day);

    const entries=[];
    do{
      const response=await fetch('https://tasks.googleapis.com/tasks/v1/'+path+'?'+params,{
        headers:{Authorization:'Bearer '+token}
      });
      if(!response.ok)throw new Error(String(response.status));

      entries.push(...(data.items||[]));

    const taskLists=await getTasksPages('users/@me/lists',new URLSearchParams({maxResults:'100'}));
    if(request!==taskRevision)return;
    setOptions(taskListSelect,taskLists);
    const results=await Promise.all(taskLists.map(async source=>{
      const items=await getTasksPages('lists/'+encodeURIComponent(source.id)+'/tasks',
        new URLSearchParams({maxResults:'100',showCompleted:'true',showHidden:'true'}));
      return items.map(item=>({...item,listTitle:source.title,listId:source.id}));
    }));
    if(request!==taskRevision)return;
    const allItems=results.flat();
    const items=allItems.filter(item=>item.status!=='completed');
    const done=allItems.filter(item=>item.status==='completed'&&(item.due?.slice(0,10)===selectedDate||!item.due));
    document.getElementById('completed-summary').textContent='완료한 할 일 ('+done.length+')';
    const groups=[['선택한 날짜',items.filter(item=>item.due?.slice(0,10)===selectedDate)],
                  ['날짜 미정',items.filter(item=>!item.due)]];

      if(!group.length)continue;
      const heading=document.createElement('h3');

        const count=document.createElement('span');count.textContent=group.length;
        heading.append(name,count);list.append(heading);

      for(const item of group){
        const row=document.createElement('label');
        row.className='item task';

        title.textContent=item.title||'제목 없는 할 일';
        const source=document.createElement('small');
        source.textContent=item.listTitle;
        const check=document.createElement('input');

        check.checked=wasComplete;
        check.setAttribute('aria-label',title.textContent+(wasComplete?' 완료 취소':' 완료'));
        check.onchange=async()=>{
          check.disabled=true;
          try{
            const url='https://tasks.googleapis.com/tasks/v1/lists/'+encodeURIComponent(item.listId)+'/tasks/'+encodeURIComponent(item.id);
            const response=await fetch(url,{
              method:'PATCH',
              headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:JSON.stringify(wasComplete?{status:'needsAction',completed:null,hidden:false}:{status:'completed'})
            });
            if(!response.ok)throw Object.assign(new Error(),{status:response.status});

            check.checked=wasComplete;
            check.disabled=false;
            status.textContent=[401,403].includes(error.status)
              ?'Google로 다시 연결을 눌러 할 일 수정 권한을 허용해 주세요.'
